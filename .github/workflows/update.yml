name: Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FREEDESKTOP_VERSION: "26.08"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install Flatpak and Flatpak-Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install SDKs and Runtime
        run: |
          flatpak install flathub org.freedesktop.Platform//${{ env.FREEDESKTOP_VERSION }} -y
          flatpak install flathub org.freedesktop.Sdk//${{ env.FREEDESKTOP_VERSION }} -y
          flatpak install flathub org.freedesktop.Sdk.Extension.dotnet10//${{ env.FREEDESKTOP_VERSION }} -y

      - name: Update upstream source and generate dependencies
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/OpenTabletDriver/OpenTabletDriver/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          REFS=$(git ls-remote https://github.com/OpenTabletDriver/OpenTabletDriver.git "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          COMMIT=$(printf '%s\n' "$REFS" | awk -v tag="$TAG" '$2 == "refs/tags/" tag "^{}" { print $1; found=1 } END { if (!found) exit 1 }' || printf '%s\n' "$REFS" | awk -v tag="$TAG" '$2 == "refs/tags/" tag { print $1 }')
          test ${#COMMIT} -eq 40
          export TAG COMMIT
          python3 -c 'import os, pathlib, re; p = pathlib.Path("net.opentabletdriver.OpenTabletDriver.yaml"); s = p.read_text(); s, n = re.subn(r"(url: https://github.com/OpenTabletDriver/OpenTabletDriver\n\s*tag: )[^\n]+(\n\s*commit: )[^\n]+", lambda m: m.group(1) + os.environ["TAG"] + m.group(2) + os.environ["COMMIT"], s); assert n == 1; p.write_text(s)'
          ./scripts/generate-sources.sh --tag "$TAG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenTabletDriver-Files
          path: |
            ${{ github.workspace }}/sources/linux-x64.json
            ${{ github.workspace }}/sources/linux-arm64.json
            ${{ github.workspace }}/net.opentabletdriver.OpenTabletDriver.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: "Update OpenTabletDriver configurations"
          title: "Automated OpenTabletDriver Update"
          body: "This is an auto-generated PR with the latest OpenTabletDriver configurations."
          branch: "feature/update-opentabletdriver"
          base: "master"
          delete-branch: true
